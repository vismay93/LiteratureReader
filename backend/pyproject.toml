[project]
name = "paper-reader"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "pillow>=10",
  "kokoro-onnx>=0.4",
  "soundfile>=0.12",
  "numpy",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
